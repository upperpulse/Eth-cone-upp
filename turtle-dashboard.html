<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turtle Pro — Multi-Market</title>
<style>
:root{
  --paper:#F5F0E6; --shell:#C4A878; --shell-dark:#A8895E;
  --bark:#3E2F1C; --bark-soft:#6B5544;
  --moss:#7A8B6F; --moss-dark:#5c7a4a; --clay:#B5543A;
  --gold:#C9A24B; --blue:#2b6cb0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',sans-serif;background:var(--paper);color:var(--bark);padding:16px;font-size:14px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto}
.mono{font-family:'JetBrains Mono','SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}

/* ── TOPBAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:48px;height:48px;border-radius:14px;background:var(--shell);display:grid;place-items:center;font-size:26px;box-shadow:0 2px 8px rgba(62,47,28,.12)}
.brand-name{font-size:22px;font-weight:700;letter-spacing:-.3px}
.brand-name em{font-style:normal;color:var(--gold)}
.brand-sub{font-size:11px;color:var(--bark-soft);letter-spacing:.8px;text-transform:uppercase;margin-top:2px}
.topbar-right{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.mode-badge{display:inline-flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:#fff;font-size:12px;font-weight:600;box-shadow:0 1px 4px rgba(62,47,28,.1)}
.mode-badge .dot{width:8px;height:8px;border-radius:50%;background:var(--moss)}
.mode-badge.live{background:var(--clay);color:#fff;box-shadow:0 2px 8px rgba(181,84,58,.35)}
.health-bar{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:11px;font-size:12px;margin-bottom:12px;font-weight:600}
.health-bar.ok{background:rgba(122,139,111,.22);color:var(--moss-dark)}
.health-bar.bad{background:var(--clay);color:#fff}
.mode-badge.live .dot{background:#fff;animation:p 1.6s infinite}
.eq-head{text-align:right}
.eq-head .lbl{font-size:10px;color:var(--bark-soft);letter-spacing:.6px;text-transform:uppercase}
.eq-head .val{font-size:24px;font-weight:700}
.eq-head .chg{font-size:12px;font-weight:600}

/* ── TABS ── */
.tabnav{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.tab-btn{flex:1;min-width:90px;padding:12px 8px;border:1px solid var(--shell-dark);border-radius:11px;background:var(--shell);color:var(--bark-soft);font-size:14px;font-weight:600;cursor:pointer;transition:.15s;font-family:inherit}
.tab-btn.active{background:var(--bark);color:var(--paper);border-color:var(--bark)}
.tab-btn:hover:not(.active){background:var(--shell-dark);color:var(--bark)}
.tab-btn .sub{display:block;font-size:10px;font-weight:500;opacity:.75;margin-top:2px}

/* ── PANELS ── */
.panel{background:var(--shell);border:1px solid var(--shell-dark);border-radius:16px;padding:18px;margin-bottom:14px}
.panel-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.panel-title{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--bark)}
.panel-note{font-size:11px;color:var(--bark-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}

/* ── POSITION CARD ── */
.pos-empty{text-align:center;padding:26px 10px;color:var(--bark-soft)}
.pos-pnl{font-size:34px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.pos-sub{font-size:12px;color:var(--bark-soft);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.5px}
.pill-long{background:rgba(122,139,111,.28);color:var(--moss-dark)}
.pill-short{background:rgba(181,84,58,.2);color:var(--clay)}
.lock-pill{display:inline-block;padding:2px 8px;border-radius:7px;background:rgba(122,139,111,.25);color:var(--moss-dark);font-size:11px;font-weight:600}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--shell-dark)}
.kv .k{font-size:10px;color:var(--bark-soft);letter-spacing:.5px;text-transform:uppercase}
.kv .v{font-size:16px;font-weight:700;margin-top:1px}
.green{color:var(--moss-dark)} .red{color:var(--clay)}

/* ── METRICS ── */
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:820px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:rgba(245,240,230,.5);border-radius:11px;padding:12px}
.metric .k{font-size:10px;color:var(--bark-soft);letter-spacing:.5px;text-transform:uppercase}
.metric .v{font-size:19px;font-weight:700;margin-top:3px}

/* ── CHANNEL SVG ── */
.channel-svg{width:100%;height:220px;display:block}
.ch-label{font-size:9px;fill:var(--bark-soft);font-family:'JetBrains Mono',monospace}
.ch-mark-label{font-size:10px;font-weight:700;font-family:'JetBrains Mono',monospace}

/* ── TABLE ── */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;min-width:400px}
th,td{padding:8px 7px;text-align:right;border-bottom:1px solid var(--shell-dark)}
th{color:var(--bark-soft);font-weight:600;font-size:10px;letter-spacing:.5px;text-transform:uppercase}
th:first-child,td:first-child{text-align:left}
.badge{display:inline-block;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700}
.b-long{background:rgba(122,139,111,.28);color:var(--moss-dark)}
.b-short{background:rgba(181,84,58,.2);color:var(--clay)}
.b-mkt{background:rgba(62,47,28,.12);color:var(--bark);margin-right:4px}

.foot{text-align:center;font-size:11px;color:var(--bark-soft);padding:14px 0 4px}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--moss);margin-right:6px;animation:p 2s infinite}
@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}
.err{text-align:center;padding:24px;color:var(--clay);font-size:13px}

@media(max-width:560px){
  body{padding:11px}
  .brand-mark{width:40px;height:40px;font-size:21px;border-radius:11px}
  .brand-name{font-size:19px} .brand-sub{display:none}
  .topbar{gap:10px;margin-bottom:14px}
  .topbar-right{width:100%;justify-content:space-between;gap:10px}
  .eq-head .val{font-size:20px}
  .mode-badge{padding:5px 11px;font-size:11px}
  .tabnav{gap:5px;margin-bottom:11px}
  .tab-btn{padding:9px 5px;font-size:13px;min-width:0}
  .panel{padding:14px;border-radius:13px}
  .pos-pnl{font-size:28px}
  table{font-size:11px} th,td{padding:6px 5px}
}
</style>
</head>
<body>
<div class="wrap">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">🐢</div>
      <div>
        <div class="brand-name">Turtle <em>Pro</em></div>
        <div class="brand-sub" id="brandSub">multi-market trend system</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="mode-badge" id="modeBadge"><span class="dot"></span><span id="modeTxt">—</span></span>
      <div class="eq-head">
        <div class="lbl">Equity รวม</div>
        <div class="val mono" id="eqVal">$—</div>
        <div class="chg" id="eqChg">—</div>
      </div>
    </div>
  </header>

  <div id="healthBar"></div>
  <div class="tabnav" id="tabnav"></div>

  <div id="tabContent"></div>

  <div class="foot"><span class="pulse"></span><span id="footTxt">กำลังเชื่อมต่อ…</span></div>
</div>

<script>
const API_URL = 'https://upcountry-tint-unlucky.ngrok-free.dev';
const $ = id => document.getElementById(id);
const fmt = (n,d=2) => n==null||isNaN(n) ? '—' : (+n).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtUSD = n => (n>=0?'+':'') + '$' + fmt(Math.abs(n));
let STATE = null;
let activeTab = 'overview';

async function loadLive(){
  try{
    const r = await fetch(API_URL.replace(/\/$/,'') + '/dashboard', {headers:{'ngrok-skip-browser-warning':'true'}});
    STATE = await r.json();
    $('footTxt').textContent = 'live · ' + new Date().toLocaleTimeString('th-TH') + ' · ' + (STATE.version||'');
    render();
  }catch(e){
    $('footTxt').textContent = 'offline — ' + e.message;
  }
}

function render(){
  if(!STATE) return;
  const S = STATE;
  const modeStr = (S.mode || 'PAPER').toUpperCase();
  $('modeTxt').textContent = modeStr;
  $('modeBadge').className = 'mode-badge' + (S.liveEnabled ? ' live' : '');
  $('eqVal').textContent = '$' + fmt(S.equity);
  const chg = (S.equity/S.start - 1) * 100;
  $('eqChg').innerHTML = `<span class="${chg>=0?'green':'red'}">${chg>=0?'+':''}${chg.toFixed(2)}% from start</span>`;
  const labels = (S.symbols||[]).map(s => S.markets[s].label).join(' + ');
  $('brandSub').textContent = labels + ' · trend system';

  renderHealth();
  renderTabs();
  renderContent();
}

function renderHealth(){
  const h = STATE.health;
  const el = $('healthBar');
  if(!h){ el.innerHTML=''; return; }
  if(h.ok){
    el.innerHTML = `<div class="health-bar ok">💚 ระบบปกติ · ข้อมูลตลาดอัพเดต${h.minsSinceData>1?' '+h.minsSinceData+' นาทีที่แล้ว':'ล่าสุด'}</div>`;
  } else {
    const bits=[];
    if(h.apiFailStreak>0) bits.push(`API ล้ม ${h.apiFailStreak} ครั้ง`);
    if(h.minsSinceData>3) bits.push(`ไม่ได้ข้อมูล ${h.minsSinceData} นาที`);
    if(h.closeErrors>0) bits.push(`ปิดไม้ไม่ออก ${h.closeErrors}`);
    if(h.orderErrors>0) bits.push(`เปิดไม้ไม่ผ่าน ${h.orderErrors}`);
    if(h.slErrors>0) bits.push(`SL ไม่ผ่าน ${h.slErrors}`);
    if(h.desyncAlerts>0) bits.push(`ข้อมูลไม่ตรง ${h.desyncAlerts}`);
    el.innerHTML = `<div class="health-bar bad">🔴 ${bits.join(' · ')||'มีปัญหา'}</div>`;
  }
}

function renderTabs(){
  const S = STATE;
  const syms = S.symbols || [];
  let h = `<button class="tab-btn ${activeTab==='overview'?'active':''}" onclick="switchTab('overview')">📊 ภาพรวม</button>`;
  for(const sym of syms){
    const m = S.markets[sym];
    const openMark = m.position ? '●' : '';
    h += `<button class="tab-btn ${activeTab===sym?'active':''}" onclick="switchTab('${sym}')">${m.label} ${openMark}
            <span class="sub">${m.stats.trades} trades · ${fmtUSD(m.stats.pnl)}</span></button>`;
  }
  h += `<button class="tab-btn ${activeTab==='history'?'active':''}" onclick="switchTab('history')">📜 ประวัติ<span class="sub">${(S.trades||[]).length} รอบ</span></button>`;
  $('tabnav').innerHTML = h;
}

function switchTab(t){ activeTab = t; renderTabs(); renderContent(); }

function renderContent(){
  const S = STATE;
  if(activeTab === 'overview') $('tabContent').innerHTML = viewOverview(S);
  else if(activeTab === 'history') { $('tabContent').innerHTML = viewHistory(S); drawHistoryChart(S); }
  else { $('tabContent').innerHTML = viewMarket(S, activeTab); drawChannel(S, activeTab); }
}

/* ═══════════ OVERVIEW ═══════════ */
function viewOverview(S){
  const st = S.stats || {};
  let cards = '';
  for(const sym of (S.symbols||[])){
    const m = S.markets[sym];
    const p = m.position;
    const body = p
      ? `<div><span class="pill ${p.dir==='long'?'pill-long':'pill-short'}">${p.dir==='long'?'🟢 LONG':'🔴 SHORT'}</span></div>
         <div class="pos-pnl ${p.floatPnl>=0?'green':'red'}" style="margin-top:10px">${fmtUSD(p.floatPnl)}</div>
         <div class="pos-sub">entry $${fmt(p.entry)} → $${fmt(p.price)} · ถือ ${p.heldH}h</div>
         <div class="kv">
           <div><div class="k">Stop Loss</div><div class="v mono">$${fmt(p.sl)}${p.beDone?' <span class="lock-pill">🛡</span>':''}</div></div>
           <div><div class="k">Peak</div><div class="v mono">$${fmt(p.peak)}</div></div>
           <div><div class="k">🔒 กำไรที่ล็อก</div><div class="v mono ${p.lockedPnl>0?'green':''}">${p.lockedPnl>0?fmtUSD(p.lockedPnl):'—'}</div></div>
           <div><div class="k">ถือมา</div><div class="v mono">${p.heldH}h</div></div>
         </div>`
      : `<div class="pos-empty">📍 FLAT — รอ breakout<div style="font-size:11px;margin-top:6px">ราคา $${fmt(m.price)}</div></div>`;
    cards += `<div class="panel">
      <div class="panel-hd">
        <span class="panel-title">${m.label}</span>
        <span class="panel-note mono">D${m.config.entryPeriod}/x${m.config.exitPeriod} · ATR×${m.config.trailATR}</span>
      </div>${body}
      <div class="kv" style="margin-top:12px">
        <div><div class="k">Trades</div><div class="v">${m.stats.trades}</div></div>
        <div><div class="k">PnL สะสม</div><div class="v ${m.stats.pnl>=0?'green':'red'}">${fmtUSD(m.stats.pnl)}</div></div>
      </div>
    </div>`;
  }
  const floatLine = S.floatPnl ? `<div class="panel-note">กำไรลอยรวม <b class="${S.floatPnl>=0?'green':'red'}">${fmtUSD(S.floatPnl)}</b></div>` : '';
  return `<div class="grid2">${cards}</div>
    <div class="panel">
      <div class="panel-hd"><span class="panel-title">สถิติรวมทั้งพอร์ต</span>${floatLine}</div>
      <div class="metrics">
        <div class="metric"><div class="k">Trades</div><div class="v">${st.trades??0}</div></div>
        <div class="metric"><div class="k">Win Rate</div><div class="v">${st.wr??0}%</div></div>
        <div class="metric"><div class="k">Avg R</div><div class="v ${(st.avgR??0)>=0?'green':'red'}">${fmt(st.avgR,2)}</div></div>
        <div class="metric"><div class="k">Max DD</div><div class="v">${fmt(st.maxDD,1)}%</div></div>
      </div>
    </div>`;
}

/* ═══════════ MARKET TAB ═══════════ */
function viewMarket(S, sym){
  const m = S.markets[sym];
  const p = m.position;
  const posPanel = p
    ? `<div class="panel">
        <div class="panel-hd"><span class="panel-title">📍 Position</span>
          <span class="pill ${p.dir==='long'?'pill-long':'pill-short'}">${p.dir==='long'?'🟢 LONG':'🔴 SHORT'}</span></div>
        <div class="pos-pnl ${p.floatPnl>=0?'green':'red'}">${fmtUSD(p.floatPnl)}</div>
        <div class="pos-sub">entry $${fmt(p.entry)} → $${fmt(p.price)}</div>
        <div class="kv">
          <div><div class="k">Stop Loss</div><div class="v mono">$${fmt(p.sl)}${p.lockedPnl>0?` <span class="lock-pill">🔒 ${fmtUSD(p.lockedPnl)}</span>`:''}</div></div>
          <div><div class="k">ถือมา</div><div class="v mono">${p.heldH}h</div></div>
          <div><div class="k">Peak</div><div class="v mono">$${fmt(p.peak)}</div></div>
          <div><div class="k">Size</div><div class="v mono">${fmt(p.qty,4)}</div></div>
        </div>
        ${p.beDone?'<div style="margin-top:12px" class="lock-pill">🛡 ล็อกทุนแล้ว — ไม่ขาดทุนแน่นอน</div>':''}
      </div>`
    : `<div class="panel"><div class="pos-empty">📍 FLAT — รอ breakout D${m.config.entryPeriod}</div></div>`;

  return posPanel + `
    <div class="panel">
      <div class="panel-hd"><span class="panel-title">📊 Donchian Channel · ${m.config.entryPeriod}H</span>
        <span class="panel-note mono">${m.label} · $${fmt(m.price)} · ATR $${fmt(m.atr)}</span></div>
      <svg class="channel-svg" id="chSvg" viewBox="0 0 600 220" preserveAspectRatio="none"></svg>
      <div style="display:flex;gap:14px;flex-wrap:wrap;font-size:11px;margin-top:10px;color:var(--bark-soft)">
        <span>━ ราคา</span><span style="color:var(--moss-dark)">▲ Entry</span>
        <span style="color:var(--clay)">🛑 SL</span><span style="color:var(--gold)">🎯 TP+2R</span>
      </div>
    </div>
    <div class="panel">
      <div class="panel-hd"><span class="panel-title">Config · ${m.label}</span></div>
      <div class="metrics">
        <div class="metric"><div class="k">Entry</div><div class="v">D${m.config.entryPeriod}</div></div>
        <div class="metric"><div class="k">Exit</div><div class="v">D${m.config.exitPeriod}</div></div>
        <div class="metric"><div class="k">Trail</div><div class="v">×${m.config.trailATR}</div></div>
        <div class="metric"><div class="k">Breakeven</div><div class="v">+${m.config.breakevenAtR}R</div></div>
      </div>
      <div class="metrics" style="margin-top:10px">
        <div class="metric"><div class="k">Trades</div><div class="v">${m.stats.trades}</div></div>
        <div class="metric"><div class="k">Win Rate</div><div class="v">${m.stats.wr}%</div></div>
        <div class="metric"><div class="k">PnL</div><div class="v ${m.stats.pnl>=0?'green':'red'}">${fmtUSD(m.stats.pnl)}</div></div>
        <div class="metric"><div class="k">ราคา</div><div class="v mono">$${fmt(m.price)}</div></div>
      </div>
    </div>`;
}

function drawChannel(S, sym){
  const m = S.markets[sym];
  const c = m.channel, svg = $('chSvg');
  if(!c || !svg || !c.history || !c.history.length){ if(svg) svg.innerHTML=''; return; }
  const W=600,H=220,padX=12,padY=20;
  const all=[c.upper,c.lower,c.price,...c.history];
  const p=m.position;
  if(p){
    if(p.entry) all.push(p.entry);
    if(p.sl) all.push(p.sl);
    if(p.peak) all.push(p.peak);
    if(p.entry&&p.sl){ const r=Math.abs(p.entry-p.sl); all.push(p.dir==='long'?p.entry+r*2:p.entry-r*2); }
  }
  const hi=Math.max(...all),lo=Math.min(...all),rng=(hi-lo)||1,pad=rng*0.1;
  const yMax=hi+pad,yMin=lo-pad,yRng=yMax-yMin;
  const Y=v=>padY+(1-(v-yMin)/yRng)*(H-padY*2);
  const n=c.history.length, X=i=>padX+(i/(n-1))*(W-padX*2);
  let s='';
  // channel band
  s+=`<rect x="${padX}" y="${Y(c.upper).toFixed(1)}" width="${W-padX*2}" height="${(Y(c.lower)-Y(c.upper)).toFixed(1)}" fill="rgba(122,139,111,.13)"/>`;
  s+=`<line x1="${padX}" y1="${Y(c.upper).toFixed(1)}" x2="${W-padX}" y2="${Y(c.upper).toFixed(1)}" stroke="var(--moss-dark)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
  s+=`<line x1="${padX}" y1="${Y(c.lower).toFixed(1)}" x2="${W-padX}" y2="${Y(c.lower).toFixed(1)}" stroke="var(--clay)" stroke-width="1.5" stroke-dasharray="5 3"/>`;
  s+=`<text x="${padX+3}" y="${(Y(c.upper)-5).toFixed(1)}" class="ch-label">D hi $${fmt(c.upper,0)}</text>`;
  s+=`<text x="${padX+3}" y="${(Y(c.lower)+12).toFixed(1)}" class="ch-label">D lo $${fmt(c.lower,0)}</text>`;
  // price path
  let d='';
  c.history.forEach((v,i)=>{ d+=(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)+' '; });
  s+=`<path d="${d}" fill="none" stroke="var(--bark)" stroke-width="2" stroke-linejoin="round"/>`;
  s+=`<circle cx="${X(n-1).toFixed(1)}" cy="${Y(c.price).toFixed(1)}" r="4" fill="var(--bark)"/>`;
  // position marks
  if(p){
    const isL=p.dir==='long';
    const col=isL?'var(--moss-dark)':'var(--clay)';
    if(p.entry){
      const eY=Y(p.entry);
      s+=`<line x1="${padX}" y1="${eY.toFixed(1)}" x2="${W-padX}" y2="${eY.toFixed(1)}" stroke="${col}" stroke-width="1.5"/>`;
      s+=`<text x="${padX+16}" y="${(eY+4).toFixed(1)}" class="ch-mark-label" fill="${col}">${isL?'▲':'▼'} $${fmt(p.entry,0)}</text>`;
    }
    if(p.sl){
      const sY=Y(p.sl);
      s+=`<line x1="${padX}" y1="${sY.toFixed(1)}" x2="${W-padX}" y2="${sY.toFixed(1)}" stroke="var(--clay)" stroke-width="1.5" stroke-dasharray="3 3"/>`;
      s+=`<text x="${padX+16}" y="${(sY-4).toFixed(1)}" class="ch-mark-label" fill="var(--clay)">🛑 $${fmt(p.sl,0)}</text>`;
    }
    if(p.entry&&p.sl){
      const r=Math.abs(p.entry-p.sl), tp=isL?p.entry+r*2:p.entry-r*2, tY=Y(tp);
      const reached=isL?(p.price>=tp):(p.price<=tp);
      s+=`<line x1="${padX}" y1="${tY.toFixed(1)}" x2="${W-padX}" y2="${tY.toFixed(1)}" stroke="var(--gold)" stroke-width="1.5" stroke-dasharray="6 3" opacity=".85"/>`;
      s+=`<text x="${padX+16}" y="${(tY-5).toFixed(1)}" class="ch-mark-label" fill="var(--gold)">🎯 +2R $${fmt(tp,0)}${reached?' ✓':''}</text>`;
    }
  }
  svg.innerHTML=s;
}

/* ═══════════ HISTORY ═══════════ */
function viewHistory(S){
  const tr = S.trades||[];
  if(!tr.length) return `<div class="panel"><div class="pos-empty">ยังไม่มีเทรด</div></div>`;
  let rows='';
  [...tr].reverse().forEach(t=>{
    const win=t.pnl>0;
    rows+=`<tr>
      <td>#${t.n} <span class="badge b-mkt">${t.label||'ETH'}</span></td>
      <td><span class="badge ${t.dir==='long'?'b-long':'b-short'}">${t.dir==='long'?'LONG':'SHORT'}</span></td>
      <td class="mono">$${fmt(t.entry)}</td>
      <td class="mono">$${fmt(t.exit)}</td>
      <td class="mono ${win?'green':'red'}">${fmtUSD(t.pnl)}</td>
      <td class="mono ${win?'green':'red'}">${t.r>=0?'+':''}${fmt(t.r,2)}</td>
    </tr>`;
  });
  return `<div class="panel">
      <div class="panel-hd"><span class="panel-title">กราฟ Buy / Sell ทุกตลาด</span></div>
      <div id="histChart"></div>
      <div style="display:flex;gap:13px;flex-wrap:wrap;font-size:11px;margin-top:10px;color:var(--bark-soft)">
        <span>▲ เข้า LONG</span><span>▼ เข้า SHORT</span>
        <span>● ออก (<span class="green">กำไร</span>/<span class="red">ขาดทุน</span>)</span>
        <span style="color:var(--blue);font-weight:600">◆ ราคาสูงสุด (ไม่ได้ปิด)</span>
      </div>
    </div>
    <div class="panel">
      <div class="panel-hd"><span class="panel-title">ตารางเทรด</span></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th>#</th><th>ทิศ</th><th>เข้า</th><th>ออก</th><th>PnL</th><th>R</th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
}

function drawHistoryChart(S){
  const box = $('histChart');
  const tr = S.trades||[];
  if(!box || !tr.length) return;
  // แยกกราฟต่อเหรียญ (ราคาคนละสเกล)
  const bySym = {};
  tr.forEach(t=>{ (bySym[t.symbol] = bySym[t.symbol]||[]).push(t); });
  let html='';
  for(const sym of Object.keys(bySym)){
    const list = bySym[sym].sort((a,b)=>(a.entryTs||a.n)-(b.entryTs||b.n));
    html += `<div style="font-size:11px;font-weight:700;color:var(--bark-soft);margin:10px 0 4px">${list[0].label||sym}</div>` + svgFor(list);
  }
  box.innerHTML = html;
}

function svgFor(S2){
  const W=1000,H=280,padL=54,padR=16,padT=16,padB=30;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const hasT = S2.every(t=>t.entryTs);
  const pts=[];
  S2.forEach(t=>{
    const e=hasT?t.entryTs:t.n*1e7, x=hasT?(t.exitTs||t.entryTs):t.n*1e7+5e6;
    pts.push({x:e,p:t.entry}); pts.push({x,p:t.exit});
    if(t.peakPrice) pts.push({x,p:t.peakPrice});
  });
  const xs=pts.map(o=>o.x), ps=pts.map(o=>o.p);
  const minX=Math.min(...xs),maxX=Math.max(...xs);
  let minP=Math.min(...ps),maxP=Math.max(...ps);
  const pd=(maxP-minP)*0.12||1; minP-=pd; maxP+=pd;
  const X=v=>padL+(maxX>minX?(v-minX)/(maxX-minX):.5)*plotW;
  const Y=v=>padT+(1-(v-minP)/(maxP-minP))*plotH;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" xmlns="http://www.w3.org/2000/svg">`;
  for(let i=0;i<=4;i++){
    const p=minP+(maxP-minP)*i/4, y=Y(p);
    s+=`<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="#A8895E" stroke-width="1" opacity=".28"/>`;
    s+=`<text x="${padL-7}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="11" fill="#6B5544" font-family="monospace">$${fmt(p,0)}</text>`;
  }
  let path=''; pts.forEach((o,i)=>{ path+=(i?'L':'M')+X(o.x).toFixed(1)+' '+Y(o.p).toFixed(1)+' '; });
  s+=`<path d="${path}" fill="none" stroke="#3E2F1C" stroke-width="1.2" opacity=".26"/>`;
  S2.forEach(t=>{
    const e=hasT?t.entryTs:t.n*1e7, x=hasT?(t.exitTs||t.entryTs):t.n*1e7+5e6;
    const x1=X(e),y1=Y(t.entry),x2=X(x),y2=Y(t.exit);
    const win=t.pnl>0, col=win?'#5c7a4a':'#B5543A', isL=t.dir==='long';
    s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${col}" stroke-width="2.4" opacity=".85"${win?'':' stroke-dasharray="4 3"'}/>`;
    if(t.peakPrice && Math.abs(t.peakPrice-t.exit)>0.001*t.exit){
      const py=Y(t.peakPrice);
      s+=`<line x1="${x2.toFixed(1)}" y1="${py.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#2b6cb0" stroke-width="1.1" stroke-dasharray="2 2" opacity=".65"/>`;
      s+=`<path d="M${x2.toFixed(1)} ${(py-6).toFixed(1)} l6 6 l-6 6 l-6 -6 z" fill="#2b6cb0" stroke="#F5F0E6" stroke-width="1.4"/>`;
    }
    if(isL) s+=`<path d="M${x1.toFixed(1)} ${(y1-7).toFixed(1)} l6 10 l-12 0 z" fill="#5c7a4a"/>`;
    else s+=`<path d="M${x1.toFixed(1)} ${(y1+7).toFixed(1)} l6 -10 l-12 0 z" fill="#B5543A"/>`;
    s+=`<circle cx="${x2.toFixed(1)}" cy="${y2.toFixed(1)}" r="4.2" fill="${col}" stroke="#F5F0E6" stroke-width="1.4"/>`;
    s+=`<text x="${x1.toFixed(1)}" y="${(isL?y1+18:y1-12).toFixed(1)}" text-anchor="middle" font-size="9" fill="#6B5544" font-family="monospace">#${t.n}</text>`;
  });
  return s+`</svg>`;
}
